# ===================================================================
# PulseFit Health Clubs (PS023) - Eureka Service Discovery Server
# ===================================================================
spring.application.name=pulsefit-eureka-server
server.port=8761

# Standalone Eureka Server Configuration
eureka.instance.hostname=localhost
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=http://${eureka.instance.hostname}:${server.port}/eureka/

# Eureka Server Dashboard & Eviction Settings
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=5000

# Logging
logging.level.com.pulsefit=INFO
logging.level.org.springframework.cloud.netflix.eureka=INFO
