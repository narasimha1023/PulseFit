# ===================================================================
# PulseFit Health Clubs (PS023) - Auth Service Configuration
# ===================================================================
spring.application.name=pulsefit-auth-service
server.port=8084

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/pulsefit_auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# JWT Configuration (HMAC SHA-256 Secret)
pulsefit.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
pulsefit.jwt.expiration-ms=86400000

# Logging
logging.level.com.pulsefit.auth=DEBUG
logging.level.org.springframework.security=INFO
